<!doctype html>
<html>
  <head>
    <script>
      function kysi() {
        let lause;

        if (paring.value == "maletajad") {
          lause = `
            SELECT DISTINCT ?isikLabel ?tiitelLabel WHERE {
              ?isik wdt:P106 wd:Q10873124;
                    wdt:P27 wd:${riik.value}.

              OPTIONAL { ?isik wdt:P2962 ?tiitel. }

              SERVICE wikibase:label {
                bd:serviceParam wikibase:language "et,en".
              }
            }
            LIMIT 50
          `;
        } else {
          lause = `
            SELECT DISTINCT ?isikLabel WHERE {
              ?isik wdt:P106 wd:Q10873124;
                    wdt:P27 wd:${riik.value};
                    wdt:P2962 wd:Q105269.

              SERVICE wikibase:label {
                bd:serviceParam wikibase:language "et,en".
              }
            }
            LIMIT 50
          `;
        }

        let aadress =
          "https://query.wikidata.org/sparql?format=json&query="
          + encodeURIComponent(lause);

        vastus.innerHTML = "Ootan vastust";

        fetch(aadress)
          .then(d => d.json())
          .then(kuva);
      }

      function kuva(d) {
        vastus.innerHTML = "";

        for (let rida of d.results.bindings) {
          let tulemus = document.createElement("li");

          if (paring.value == "maletajad") {
            tulemus.textContent =
              rida.isikLabel.value + " – " +
              (rida.tiitelLabel
                ? rida.tiitelLabel.value
                : "tiitel märkimata");
          } else {
            tulemus.textContent = rida.isikLabel.value;
          }

          vastus.appendChild(tulemus);
        }
      }
    </script>
  </head>

  <body>
    <h1>Maletajad Wikidatas</h1>

    <p>Vali riik:</p>

    <select id="riik">
      <option value="Q191">Eesti</option>
      <option value="Q33">Soome</option>
      <option value="Q34">Rootsi</option>
    </select>

    <p>Vali päring:</p>

    <select id="paring">
      <option value="maletajad">Maletajad ja nende tiitlid</option>
      <option value="suurmeistrid">Suurmeistrid</option>
    </select>

    <input type="button" value="Otsi" onclick="kysi()">

    <ul id="vastus"></ul>
  </body>
</html>
