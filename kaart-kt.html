<!DOCTYPE html>
<html>
<head>
  <title>Friedebert Tuglas – põgenemine läbi Euroopa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
  <style>
    body {
      padding: 0;
      margin: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    #kaardikiht {
      width: 100%;
      height: 100%;
    }
  </style>
  <script>
    var kaart;
    function algus() {
      // Maailmakaart
      kaart = L.map('kaardikiht').setView([30, 10], 3);
      // OpenStreetMap
      new L.TileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          attribution: '&copy; OpenStreetMap contributors'
        }
      ).addTo(kaart);
      fetch("https://script.google.com/macros/s/AKfycbztkJVFBjmf-Ca2LLADl8sphLilyWNr2OTqzsd7ph3VH5p5k4e4NUsa85YXdQPZOHR_/exec")
        .then(response => response.json())
        .then(andmed => {
          andmed.slice(1).forEach(rida => {

            let nimi = rida[0];
            let laius = rida[1];
            let pikkus = rida[2];
            let info = rida[3];

            L.marker([laius, pikkus])
              .addTo(kaart)
              .bindPopup(
                "<b>" + nimi + "</b><br>" + info
              );
          });
        });
    }
  </script>
</head>
<body onload="algus()">
  <div id="kaardikiht"></div>
</body>
</html>
