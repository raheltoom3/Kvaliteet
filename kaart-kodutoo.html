<!DOCTYPE html>
<html>
 <head>
 <title>Kaart</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
 <style>
   body {padding: 0; margin: 0; }
   html, body { height: 100%; width: 100%;}
   #kaardikiht {float: bottom; width:100%; height:100%;}
 </style>
 <script>
   var kaart;
   function algus(){
      kaart = L.map('kaardikiht').setView([20, 0], 2);
      new L.TileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
        }
      ).addTo(kaart);
      L.marker([58.5953, 25.0136])
      .addTo(kaart)
      .bindPopup("Eesti, Tuglase kodumaa");

      L.marker([59.9343, 30.3351])
      .addTo(kaart)
      .bindPopup("Peterburi – Tuglasega seotud linn");

      L.marker([60.1699, 24.9384])
     .addTo(kaart)
     .bindPopup("Soome – oluline pagulusaastate paik");

     L.marker([48.8566, 2.3522])
     .addTo(kaart)
     .bindPopup("Pariis – Tuglas veetis siin mitu talve");

     L.marker([41.9028, 12.4964])
     .addTo(kaart)
     .bindPopup("Itaalia – Tuglas reisis Itaalias, sh Roomas");

   }

 </script>
 </head>

 <body onload="algus()">
   <div id="kaardikiht"></div>
 </body>
</html>
