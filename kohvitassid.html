
<!doctype html>
<html>
<head>
    <title>Ilma illustreerivad kohvitassid</title>

    <script>
        let g;

        // Ilmaandmed
        let ilmaandmed = [];

        // Funktsioon kohvitassi joonistamiseks
        // x, y - kohvitassi asukoht
        // temp - temperatuur
        // tuul - tuule kiirus
        // puhang - tuulepuhang
        // kuupaev - kuupäev

        function kohvitass(x, y, temp, tuul, puhang, kuupaev) {

            let laius = 35 + Math.abs(temp) * 3;
            let korgus = 40 + Math.abs(temp) * 2;

            // Tassi põhi ja küljed
            g.beginPath();
            g.rect(x - laius / 2, y - korgus, laius, korgus);
            g.stroke();

            // Tassi sang
            g.beginPath();
            g.arc(x + laius / 2 + 10, y - korgus / 2, 12, -Math.PI / 2, Math.PI / 2);
            g.stroke();

            // Kohvi pind
            g.beginPath();
            g.moveTo(x - laius / 2, y - korgus + 8);
            g.lineTo(x + laius / 2, y - korgus + 8);
            g.stroke();

            // Auru jooned
            for (let i = 0; i < puhang; i += 4) {
                g.beginPath();
                g.moveTo(x + i - puhang / 2, y - korgus - 5);
                g.lineTo(x + i - puhang / 2 + tuul, y - korgus - 20);
                g.stroke();
            }

            // Kuupäev
            g.textAlign = "center";
            g.font = "14px Arial";
            g.fillStyle = "black";
            g.fillText(kuupaev, x, y + 20);
        }

        // Joonistab kõik kohvitassid
        function joonista() {
            let tahvel = document.getElementById("tahvel");
            g = tahvel.getContext("2d");

            g.clearRect(0, 0, 900, 340);

            for (let i = 0; i < ilmaandmed.length; i++) {
                let d = ilmaandmed[i];

                let x = 100 + i * 180;
                let y = 260;

                kohvitass(x, y, d[1], d[2], d[3], d[0]);
            }
        }

        // Loeb Google Sheetsist kõige uuemad andmed
        function uuendaAndmed() {
            fetch("SINU_APPS_SCRIPTI_URL")
                .then(response => response.json())
                .then(andmed => loe(andmed))
                .catch(error => alert("Andmete laadimine ebaõnnestus: " + error));
        }

        // Võtab andmed vastu ja joonistab uuesti
        function loe(andmed) {
            ilmaandmed = andmed.slice(1);
            joonista();
        }

    </script>
</head>

<body onload="joonista()">

    <h1>Ilma illustreerivad kohvitassid</h1>

    <p>
        Tassi suurus = temperatuur |
        Auru kaldenurk = tuul |
        Auru hulk = tuulepuhang
    </p>

    <button onclick="uuendaAndmed()">Uuenda andmeid</button>

    <br><br>

    <canvas id="tahvel" width="900" height="340">
    </canvas>

</body>
</html>
