<!DOCTYPE html>
<html>
<head>
  <title>Kaart</title>
  <!-- Leaflet -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
  <style>
    body {
      padding: 0;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    #kaardikiht {
      width: 100%;
      height: 70%;
    }
    #selgitus {
      padding: 10px;
      font-size: 16px;
    }
    #tulemused {
      padding: 10px;
      height: 25%;
      overflow-y: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
    }
    th {
      background-color: #eee;
    }
  </style>
  <script>
    let kaart;
    let grupp;
    let tabeliKohad = [];
    let kasutajaMarker;
    function algus() {
      kaart = L.map('kaardikiht').setView([59.439, 24.773], 7);
      new L.TileLayer(
        'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA',
        {
          attribution: "Map: <a href='http://www.maaamet.ee/'>Maa-amet</a>",
          tms: true
        }
      ).addTo(kaart);
      grupp = L.layerGroup();
      grupp.addTo(kaart);
      kaart.on("click", valiAsukoht);
      fetch(
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxFzOwqljwhsUqxgOhESofN3IMTcWDL4tcmjuTkCXTgGQxMMC8OT7RImFSx39QkArC3fDIzXNYaAVV/pub?output=csv"
      )
      .then(vastus => vastus.text())
      .then(loeCSV)
      .catch(viga => {
        console.log("Google Sheetsi lugemisel tekkis viga:", viga);
        document.getElementById("selgitus").innerText =
          "Google Sheetsist andmete laadimine ebaõnnestus.";
      });

    }
    function loeCSV(csv) {
      let read = csv.trim().split("\n");
      let pealkirjad = read[0].split(",");
      console.log("Veerud:", pealkirjad);
      for (let i = 1; i < read.length; i++) {
        let rida = read[i].split(",");
        // A = ajatempel
        // B = kohanimi
        // C = pikkuskraad
        // D = laiuskraad

        if (rida.length < 4) {
          continue;
        }
        let nimi = rida[1];
        let lng = parseFloat(rida[2]);
        let lat = parseFloat(rida[3]);
        if (!isNaN(lat) && !isNaN(lng)) {

          let koht = {
            nimi: nimi,
            lat: lat,
            lng: lng
          };
          tabeliKohad.push(koht);
          let marker = L.marker([lat, lng]);
          marker.bindPopup(
            "<b>" + nimi + "</b><br>" +
            "Pikkuskraad: " + lng + "<br>" +
            "Laiuskraad: " + lat
          );
          marker.addTo(grupp);
        }
      }
      console.log("Tabelist leitud kohad:", tabeliKohad);
      if (tabeliKohad.length > 0) {
        let piirid = L.latLngBounds(
          tabeliKohad.map(koht => [koht.lat, koht.lng])
        );
        kaart.fitBounds(piirid);
      }
    }
    function valiAsukoht(e) {
      let koht = e.latlng;
      if (kasutajaMarker) {
        kasutajaMarker.setLatLng(koht);
      }
      else {

        kasutajaMarker = L.marker(koht, {
          draggable: true
        });

        kasutajaMarker.bindPopup(
          "<b>Sinu valitud asukoht</b>"
        );

        kasutajaMarker.addTo(kaart);
        kasutajaMarker.on("dragend", arvutaKaugused);
      }
      arvutaKaugused();
    }
    function arvutaKaugused() {

      if (!kasutajaMarker) {
        return;
      }
      let kasutajaKoht = kasutajaMarker.getLatLng();
      document.getElementById("selgitus").innerText =
        "Valitud asukoht: " +
        kasutajaKoht.lat.toFixed(5) +
        ", " +
        kasutajaKoht.lng.toFixed(5);
      let tulemused = document.getElementById("tulemused");
      tulemused.innerHTML = "";
      let tabel = document.createElement("table");
      tabel.innerHTML =
        "<tr>" +
        "<th>Koht</th>" +
        "<th>Kaugus</th>" +
        "</tr>";
      for (let koht of tabeliKohad) {

        let tabeliKoht = L.latLng(
          koht.lat,
          koht.lng
        );
        let kaugus = kasutajaKoht.distanceTo(tabeliKoht);
        let kaugusKm = kaugus / 1000;
        let rida = document.createElement("tr");
        rida.innerHTML =
          "<td>" + koht.nimi + "</td>" +
          "<td>" + kaugusKm.toFixed(2) + " km</td>";
        tabel.appendChild(rida);
      }
      tulemused.appendChild(tabel);
    }
  </script>
</head>
<body onload="algus()">

  <div id="selgitus">
    Laadin Google Sheetsist kohti...
  </div>
  <div id="kaardikiht"></div>
  <div id="tulemused">
  </div>
</body>
</html>
