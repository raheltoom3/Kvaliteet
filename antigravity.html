
<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maleõppe keskkond</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            max-width: 620px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: #111827;
            text-align: center;
        }

        .info-bar {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 9999px;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .question-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin: 10px 0 20px 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            gap: 12px;
        }

        .question-number {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 700;
            color: #111827;
        }

        .category {
            font-size: 0.85rem;
            color: #64748b;
        }

        .answer {
            display: none;
            background-color: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 8px;
        }

        .answer.visible {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .btn-next {
            background-color: #059669;
        }

        .btn-next:hover {
            background-color: #047857;
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .difficulty {
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            background-color: #e2e8f0;
            padding: 4px 10px;
            border-radius: 9999px;
            width: fit-content;
            margin: 0 auto;
        }

        @media (max-width: 480px) {
            .question-text {
                font-size: 1.15rem;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>♟ Maleõppe keskkond</h1>

    <div class="info-bar">
        <div>Viimati uuendatud: <strong id="viimatiUuendatud">-</strong></div>
        <div>Järgmine uuendus: <strong id="loendur">30</strong> s pärast</div>
        <div><span id="olek" class="status-badge">Laadimine...</span></div>
    </div>

    <div class="question-box">

        <div class="question-number" id="küsimuseNumber">
            Küsimus 1
        </div>

        <div class="question-text" id="küsimus">
            Andmete laadimine...
        </div>

        <div class="category" id="teema"></div>

        <div class="difficulty" id="raskus"></div>

        <div class="answer" id="vastus"></div>

    </div>

    <div class="controls">

        <div class="btn-group">
            <button id="vastuseNupp" onclick="naitaVastust()">
                Näita vastust
            </button>

            <button id="jargmineNupp" class="btn-next" onclick="jargmineKusimus()">
                Järgmine küsimus →
            </button>
        </div>

        <button id="uuendaNupp" onclick="laeAndmed()">
            Uuenda kohe
        </button>

    </div>

</div>

<script>

    // Google Sheetsi CSV-link
    const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSN_8fkSRyvs7YgrN4o9m2ZuWpQGZG0sirJF7ZlXsi-Neoi_Ql90R6c8ZqD6V55IHGA_3tmlQqsd61A/pub?gid=0&single=true&output=csv";

    let kusimused = [];
    let praeguneIndeks = 0;
    let sekundeidJaanud = 30;

    // Loeb CSV-faili ja muudab selle andmeteks
    function loeCSV(tekst) {

        const read = tekst.trim().split(/\r?\n/);

        return read.slice(1).map(rida => {

            const veerud = rida.match(/("(?:[^"]|"")*"|[^,]*)(,|$)/g) || [];

            const andmed = veerud.map(v =>
                v.replace(/,$/, "")
                 .replace(/^"|"$/g, "")
                 .replace(/""/g, '"')
                 .trim()
            );

            return {
                id: andmed[0],
                kusimus: andmed[1],
                vastus: andmed[2],
                teema: andmed[3],
                raskus: andmed[4]
            };

        }).filter(k => k.kusimus && k.vastus);

    }

    // Kuvab praeguse küsimuse
    function kuvaKusimus() {

        if (kusimused.length === 0) return;

        const k = kusimused[praeguneIndeks];

        document.getElementById("küsimuseNumber").textContent =
            "Küsimus " + (praeguneIndeks + 1) + " / " + kusimused.length;

        document.getElementById("küsimus").textContent = k.kusimus;

        document.getElementById("teema").textContent =
            "Teema: " + k.teema;

        document.getElementById("raskus").textContent =
            "Raskusaste: " + k.raskus;

        document.getElementById("vastus").textContent =
            "Õige vastus: " + k.vastus;

        document.getElementById("vastus").classList.remove("visible");

        document.getElementById("vastuseNupp").textContent =
            "Näita vastust";

    }

    // Näitab või peidab vastuse
    function naitaVastust() {

        const vastus = document.getElementById("vastus");
        const nupp = document.getElementById("vastuseNupp");

        vastus.classList.toggle("visible");

        nupp.textContent = vastus.classList.contains("visible")
            ? "Peida vastus"
            : "Näita vastust";

    }

    // Liigub järgmise küsimuse juurde
    function jargmineKusimus() {

        if (kusimused.length === 0) return;

        praeguneIndeks = (praeguneIndeks + 1) % kusimused.length;

        kuvaKusimus();

    }

    // Laeb andmed Google Sheetsist
    async function laeAndmed() {

        const olekEl = document.getElementById("olek");

        olekEl.textContent = "Uuendamine...";

        try {

            const vastus = await fetch(URL + "&t=" + Date.now());

            if (!vastus.ok) {
                throw new Error("HTTP viga: " + vastus.status);
            }

            const tekst = await vastus.text();

            const uuedKusimused = loeCSV(tekst);

            if (uuedKusimused.length === 0) {
                throw new Error("Tabelis ei ole küsimusi.");
            }

            const vanaId = kusimused[praeguneIndeks]?.id;

            kusimused = uuedKusimused;

            // Säilitab sama küsimuse, kui see on tabelis alles
            const uusIndeks = kusimused.findIndex(k => k.id === vanaId);

            praeguneIndeks = uusIndeks >= 0 ? uusIndeks : 0;

            kuvaKusimus();

            document.getElementById("viimatiUuendatud").textContent =
                new Date().toLocaleTimeString("et-EE");

            olekEl.textContent =
                "Uuendatud (" + kusimused.length + " küsimust)";

            olekEl.style.backgroundColor = "#dcfce7";
            olekEl.style.color = "#15803d";

            sekundeidJaanud = 30;

            document.getElementById("loendur").textContent = 30;

        } catch (viga) {

            console.error("Viga andmete laadimisel:", viga);

            olekEl.textContent = "Viga andmete laadimisel";

            olekEl.style.backgroundColor = "#fee2e2";
            olekEl.style.color = "#b91c1c";

        }

    }

    // Automaatne uuendamine iga 30 sekundi järel
    setInterval(() => {

        sekundeidJaanud--;

        if (sekundeidJaanud <= 0) {

            laeAndmed();

        } else {

            document.getElementById("loendur").textContent =
                sekundeidJaanud;

        }

    }, 1000);

    // Esimene andmete laadimine lehe avamisel
    laeAndmed();

</script>

</body>
</html>
